[package]
name = "WatameLauncherBeta"
version = "1.2.8"
edition = "2021"
build = "build.rs"

[dependencies]
zip = { version = "0.6", features = ["deflate"] }
winreg = "0.50"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
discord-rich-presence = "1.1"
anyhow = "1.0"
image = "0.24"
reqwest = { version = "0.11", features = ["blocking", "json"] }
eframe = "0.27"

# winapi is used for OpenProcess, WaitForSingleObject, CloseHandle, and CREATE_NO_WINDOW
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "synchapi", "handleapi", "winbase", "winnt", "wincon"] }

[build-dependencies]
winres = "0.1"

[profile.release]
panic = "abort"
strip = true