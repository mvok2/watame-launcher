[package]
name = "kaizen-launcher"
version = "1.2.8"
edition = "2021"
build = "build.rs"

[[bin]]
name = "KaizenLauncher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "0.6"
winreg = "0.52"
urlencoding = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1"
eframe = "0.27"
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
winapi = { version = "0.3", features = ["winuser", "handleapi", "synchapi", "winbase", "processthreadsapi", "winnt"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"